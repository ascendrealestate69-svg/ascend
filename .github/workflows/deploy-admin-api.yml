name: Deploy admin API

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-admin-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ASCEND_ADMIN_PASSWORD }}
          GITHUB_CONTENT_TOKEN: ${{ secrets.ASCEND_CONTENTS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The GitHub Actions secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The GitHub Actions secret CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::The GitHub Actions secret ASCEND_ADMIN_PASSWORD is missing."
            exit 1
          fi
          if [ -z "$GITHUB_CONTENT_TOKEN" ]; then
            echo "::error::The GitHub Actions secret ASCEND_CONTENTS_TOKEN is missing."
            exit 1
          fi

      - name: Create or reuse the leads database
        id: database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          headers=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          listing="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api")"
          database_id="$(jq -r '.result[]? | select(.name == "ascend-leads") | .uuid' <<< "$listing" | head -n 1)"
          if [ -z "$database_id" ]; then
            created="$(curl --fail-with-body --silent --show-error -X POST "${headers[@]}" "$api" --data '{"name":"ascend-leads"}')"
            database_id="$(jq -er '.result.uuid' <<< "$created")"
          fi
          echo "id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Configure Worker database binding
        env:
          D1_DATABASE_ID: ${{ steps.database.outputs.id }}
        run: |
          node -e "const fs = require('node:fs'); const file = 'worker/wrangler.toml'; const text = fs.readFileSync(file, 'utf8'); if (!text.includes('REPLACE_WITH_D1_DATABASE_ID')) throw new Error('Expected D1 database placeholder was not found.'); fs.writeFileSync(file, text.replace('REPLACE_WITH_D1_DATABASE_ID', process.env.D1_DATABASE_ID));"

      - name: Run database migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply ascend-leads --remote --config wrangler.toml

      - name: Bootstrap Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Store Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ASCEND_ADMIN_PASSWORD }}
          GITHUB_CONTENT_TOKEN: ${{ secrets.ASCEND_CONTENTS_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 secret put ADMIN_PASSWORD --config wrangler.toml
          printf '%s' "$GITHUB_CONTENT_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN --config wrangler.toml

      - name: Deploy Worker and capture its URL
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml 2>&1 | tee "$RUNNER_TEMP/worker-deploy.log"
          worker_url="$(grep -Eo 'https://[[:alnum:]._-]+\.workers\.dev' "$RUNNER_TEMP/worker-deploy.log" | tail -n 1)"
          if [ -z "$worker_url" ]; then
            echo "::error::Could not find the deployed workers.dev URL in Wrangler output."
            exit 1
          fi
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Set the website API URL
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node -e "const fs = require('node:fs'); fs.writeFileSync('api-config.js', 'window.ASCEND_API_URL = ' + JSON.stringify(process.env.WORKER_URL) + ';\\n');"

      - name: Publish API URL to GitHub Pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-config.js
          if git diff --cached --quiet; then
            echo "The published API URL is already current."
            exit 0
          fi
          git commit -m "Configure published admin API URL"
          git push
